openapi: 3.1.0
info:
  title: CareOnRoad Backend MVP API
  version: 0.1.0
  description: >
    Backend-only v1 API added to the existing DEMO_AI Next.js application.
    Existing /api/chatbot routes are outside this contract and remain unchanged.
  x-error-status-policy:
    conflict: >
      409 for unique conflicts, active assignment/job conflicts, idempotency
      mismatch, and stale quote/version decisions.
    invalid-input: >
      400 or 422 according to the existing project convention for invalid
      input and input-caused validation/check-constraint failures.
    authentication: 401 for missing or invalid authentication.
    authorization: 403 for role or ownership denial.
    not-found: 404 for absent resources.
  x-idempotency-policy:
    required_client_header:
      - POST /api/v1/service-requests
      - POST /api/v1/payments/orders
    not_required:
      - motorcycle create/update/archive
      - dispatch offer accept/decline
      - quote approve/reject
      - provider webhooks
    webhook_deduplication: >
      Provider webhooks deduplicate by provider event id when supplied,
      otherwise provider order reference plus event type.
servers:
  - url: http://localhost:3000
security:
  - bearerAuth: []
paths:
  /api/v1/auth/me:
    get:
      operationId: getCurrentActor
      responses:
        "200":
          description: Current application actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /api/v1/auth/profile:
    post:
      operationId: bootstrapProfile
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 120
      responses:
        "200":
          description: Existing or newly created profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Actor"
  /api/v1/auth/devices:
    post:
      operationId: registerUserDevice
      description: >
        Registers backend-only notification device metadata. Audit and outbox
        payloads contain sanitized identifiers only, never a raw device token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [device_key, platform]
              properties:
                device_key:
                  type: string
                  minLength: 8
                  maxLength: 1000
                platform:
                  type: string
                  maxLength: 50
      responses:
        "200":
          description: Device registration created or refreshed
  /api/v1/motorcycles:
    get:
      operationId: listMotorcycles
      responses:
        "200":
          description: Owned motorcycles
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Motorcycle"
    post:
      operationId: createMotorcycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MotorcycleInput"
      responses:
        "201":
          description: Motorcycle created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Motorcycle"
  /api/v1/motorcycles/{motorcycleId}:
    parameters:
      - $ref: "#/components/parameters/MotorcycleId"
    get:
      operationId: getMotorcycle
      responses:
        "200":
          description: Owned motorcycle
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Motorcycle"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMotorcycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MotorcycleInput"
      responses:
        "200":
          description: Motorcycle updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Motorcycle"
    delete:
      operationId: archiveMotorcycle
      responses:
        "204":
          description: Motorcycle archived
  /api/v1/service-requests:
    get:
      operationId: listServiceRequests
      parameters:
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: Actor-visible requests
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PagedServiceRequests"
    post:
      operationId: createServiceRequest
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceRequestInput"
      responses:
        "201":
          description: Request created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/service-requests/{requestId}:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: getServiceRequest
      responses:
        "200":
          description: Actor-visible request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/v1/service-requests/{requestId}/cancel:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: cancelServiceRequest
      description: >
        Locks and re-checks the same service-request row used by mechanic offer
        acceptance. If acceptance committed first and the request is assigned,
        direct rider cancellation returns a conflict unless a separate
        authorized assignment-cancellation workflow is used.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                reason:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "200":
          description: Request canceled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ServiceRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/service-requests/{requestId}/media:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: addServiceRequestMediaMetadata
      description: >
        Adds ownership-protected media metadata or an object reference. Raw
        media is not stored in audit or outbox payloads.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestMediaMetadataInput"
      responses:
        "201":
          description: Request media metadata added
  /api/v1/service-requests/{requestId}/dispatch:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    post:
      operationId: startDispatch
      description: >
        Uses radius steps 2, 5, 8, and 12 km; 60-second offers; at most four
        rounds; a batch of ten candidates; and a 360-second total wait.
        Candidate ordering is deterministic by eligibility, distance, rating,
        workload, availability update time, then mechanic id. Mechanics with
        missing latest_location or location_updated_at older than 300 seconds
        are ineligible.
      responses:
        "202":
          description: Dispatch round created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DispatchRound"
  /api/v1/mechanics/me/profile:
    get:
      operationId: getMyMechanicDispatchProfile
      responses:
        "200":
          description: Current mechanic dispatch profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MechanicDispatchProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      operationId: updateMyMechanicDispatchProfile
      description: >
        Updates mechanic-editable dispatch settings only. profile_status,
        rating_avg, and rating_count are backend-owned and rejected when
        supplied by a mechanic.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MechanicDispatchProfileUpdate"
      responses:
        "200":
          description: Mechanic dispatch profile updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MechanicDispatchProfile"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/mechanics/me/availability:
    put:
      operationId: updateMechanicAvailability
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [is_available]
              properties:
                is_available:
                  type: boolean
      responses:
        "200":
          description: Availability updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MechanicDispatchProfile"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/mechanics/me/location:
    put:
      operationId: updateMechanicLocation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GeoPoint"
      responses:
        "204":
          description: Location updated
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /api/v1/dispatch/offers:
    get:
      operationId: listMyDispatchCandidates
      responses:
        "200":
          description: Offered dispatch candidates for current mechanic
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/DispatchCandidate"
  /api/v1/dispatch/offers/{offerId}/accept:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: acceptDispatchCandidate
      description: >
        Race-safe and transactionally idempotent by candidate, actor, request,
        and assignment state. No client X-Idempotency-Key is required.
      responses:
        "201":
          description: Assignment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/dispatch/offers/{offerId}/decline:
    parameters:
      - $ref: "#/components/parameters/OfferId"
    post:
      operationId: rejectDispatchCandidate
      responses:
        "204":
          description: Candidate offer rejected
  /api/v1/assignments:
    get:
      operationId: listAssignments
      responses:
        "200":
          description: Actor-visible assignments
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Assignment"
  /api/v1/assignments/{assignmentId}/status:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: transitionAssignment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status:
                  $ref: "#/components/schemas/AssignmentStatus"
                reason:
                  type: string
                  maxLength: 500
      responses:
        "200":
          description: Assignment transitioned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/assignments/{assignmentId}/diagnoses:
    parameters:
      - $ref: "#/components/parameters/AssignmentId"
    post:
      operationId: createMechanicDiagnosis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MechanicDiagnosisInput"
      responses:
        "201":
          description: Diagnosis recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MechanicDiagnosis"
  /api/v1/service-requests/{requestId}/quotes:
    parameters:
      - $ref: "#/components/parameters/RequestId"
    get:
      operationId: listQuotes
      responses:
        "200":
          description: Request quote versions
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Quote"
    post:
      operationId: createQuoteVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteInput"
      responses:
        "201":
          description: Quote version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /api/v1/quotes/{quoteId}/approve:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      operationId: approveQuote
      description: >
        Uses ownership and latest-version conflict checks. No client
        X-Idempotency-Key is required.
      responses:
        "200":
          description: Quote approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/quotes/{quoteId}/reject:
    parameters:
      - $ref: "#/components/parameters/QuoteId"
    post:
      operationId: rejectQuote
      responses:
        "200":
          description: Quote rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /api/v1/payments/orders:
    post:
      operationId: createPaymentOrder
      description: >
        Creates a provider-neutral payment order for mock or sandbox adapter
        testing only. Idempotency is scoped by authenticated actor, endpoint,
        provider_code, quote_id, and key. Identical payload replay returns the
        existing result; a different payload conflicts. Payload hash and result
        metadata are retained for at least 24 hours. It does not perform
        production checkout or settlement.
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [quote_id, provider_code]
              properties:
                quote_id:
                  type: string
                  format: uuid
                provider_code:
                  type: string
                  minLength: 1
      responses:
        "201":
          description: Payment order created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /api/v1/payments/orders/{paymentOrderId}:
    parameters:
      - name: paymentOrderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getPaymentOrder
      responses:
        "200":
          description: Payment order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentOrder"
  /api/v1/payments/webhooks/{provider}:
    post:
      operationId: processPaymentWebhook
      description: >
        Processes a verified mock or sandbox provider fixture idempotently.
        Deduplication uses provider event id or, when unavailable, provider
        order reference plus event type. Browser/client callbacks are not
        authoritative payment-success signals.
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        "200":
          description: Event accepted or already processed
        "400":
          $ref: "#/components/responses/InvalidInput"
        "401":
          description: Invalid provider signature
  /api/v1/reminders:
    get:
      operationId: listReminderRules
      responses:
        "200":
          description: Owned reminder rules
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/ReminderRule"
    post:
      operationId: createReminderRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderRuleInput"
      responses:
        "201":
          description: Reminder rule created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderRule"
  /api/v1/reminders/{reminderId}:
    parameters:
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateReminderRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderRuleInput"
      responses:
        "200":
          description: Reminder rule updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderRule"
  /api/v1/reminders/{reminderId}/snooze:
    parameters:
      - name: reminderId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: snoozeReminderRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [until]
              properties:
                until:
                  type: string
                  format: date-time
      responses:
        "200":
          description: Reminder snoozed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReminderRule"
  /api/v1/internal/workers/reminders/run:
    post:
      operationId: runReminderWorker
      security:
        - workerSecret: []
      responses:
        "202":
          description: Reminder batch processed or queued
  /api/v1/internal/workers/outbox/run:
    post:
      operationId: runOutboxWorker
      security:
        - workerSecret: []
      responses:
        "202":
          description: Outbox batch processed
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    workerSecret:
      type: apiKey
      in: header
      name: X-Worker-Secret
  parameters:
    IdempotencyKey:
      name: X-Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 200
    Cursor:
      name: cursor
      in: query
      required: false
      schema:
        type: string
    MotorcycleId:
      name: motorcycleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    QuoteId:
      name: quoteId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    InvalidInput:
      description: Invalid input
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Unauthorized:
      description: Authentication required or invalid
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Forbidden:
      description: Authenticated actor lacks the required role or ownership
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    NotFound:
      description: Resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    UnprocessableInput:
      description: Input violates a domain or database validation constraint
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
    Conflict:
      description: State or concurrency conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ApiError"
  schemas:
    ApiError:
      type: object
      additionalProperties: false
      required: [error_code, message]
      properties:
        error_code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          additionalProperties: true
    Actor:
      type: object
      additionalProperties: false
      required: [id, roles, status]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        roles:
          type: array
          items:
            enum: [rider, mechanic, admin]
        status:
          enum: [active, suspended, archived]
    MechanicDispatchProfile:
      type: object
      additionalProperties: false
      required:
        [user_id, profile_status, is_available, service_radius_km,
         availability_updated_at, rating_avg, rating_count, service_types,
         created_at, updated_at]
      properties:
        user_id:
          type: string
          format: uuid
        profile_status:
          enum: [pending, active, suspended, banned]
        is_available:
          type: boolean
          description: >
            MVP merged state. true means both online and accepting jobs.
        service_radius_km:
          type: number
          exclusiveMinimum: 0
        latest_location:
          $ref: "#/components/schemas/GeoPoint"
        location_updated_at:
          type: string
          format: date-time
          description: >
            Backend-controlled timestamp. Automatic dispatch excludes this
            profile when the location is older than 300 seconds.
        availability_updated_at:
          type: string
          format: date-time
        rating_avg:
          type: number
          minimum: 0
          maximum: 5
          readOnly: true
          default: 0
        rating_count:
          type: integer
          minimum: 0
          readOnly: true
          default: 0
        service_types:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/ServiceType"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    MechanicDispatchProfileUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        service_radius_km:
          type: number
          exclusiveMinimum: 0
        service_types:
          type: array
          uniqueItems: true
          minItems: 1
          items:
            $ref: "#/components/schemas/ServiceType"
    MotorcycleInput:
      type: object
      additionalProperties: false
      required: [brand_text, model_text]
      properties:
        brand_text:
          type: string
          minLength: 1
          maxLength: 100
        model_text:
          type: string
          minLength: 1
          maxLength: 100
        license_plate:
          type: string
          maxLength: 30
        year:
          type: integer
          minimum: 1950
          maximum: 2100
        notes:
          type: string
          maxLength: 1000
    Motorcycle:
      allOf:
        - $ref: "#/components/schemas/MotorcycleInput"
        - type: object
          required: [id, rider_id, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            rider_id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    GeoPoint:
      type: object
      additionalProperties: false
      required: [latitude, longitude]
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
    ServiceRequestInput:
      type: object
      additionalProperties: false
      description: >
        Conditional validation is authoritative: emergency_rescue requires
        pickup location and prohibits scheduled_start_at; mobile_repair
        requires pickup location or address and prohibits scheduled_start_at;
        at_home_service requires address and future scheduled_start_at;
        Patch 3 periodic_maintenance requires a future scheduled_start_at.
        After Patch 7, a reminder-originated periodic_maintenance request may
        omit scheduled_start_at only when reminder_id and reminder_context_id
        identify an owned due occurrence for the selected motorcycle.
        other requires fulfillment_mode.
        other/immediate_location requires location or address and prohibits
        scheduled_start_at; other/scheduled_visit requires address and future
        scheduled_start_at. Other service types reject client-supplied
        fulfillment_mode.
      required: [motorcycle_id, service_type, problem_description]
      properties:
        motorcycle_id:
          type: string
          format: uuid
        service_type:
          $ref: "#/components/schemas/ServiceType"
        fulfillment_mode:
          $ref: "#/components/schemas/FulfillmentMode"
        problem_description:
          type: string
          minLength: 3
          maxLength: 3000
        location:
          $ref: "#/components/schemas/GeoPoint"
        address_text:
          type: string
          maxLength: 500
        scheduled_start_at:
          type: string
          format: date-time
        reminder_id:
          type: string
          format: uuid
          description: >
            Available only after Patch 7 reminder integration. Identifies the
            owned reminder rule that originated periodic maintenance.
        reminder_context_id:
          type: string
          format: uuid
          description: >
            Available only after Patch 7 reminder integration. Identifies the
            due occurrence/context validated for the selected motorcycle.
        safety_answers:
          type: object
          additionalProperties: true
        maintenance_notes:
          type: string
          maxLength: 2000
        media_metadata:
          type: array
          maxItems: 10
          items:
            $ref: "#/components/schemas/RequestMediaMetadataInput"
    RequestMediaMetadataInput:
      type: object
      additionalProperties: false
      required: [media_type, object_reference, content_type]
      properties:
        media_type:
          type: string
          maxLength: 50
        object_reference:
          type: string
          maxLength: 1000
        content_type:
          type: string
          maxLength: 200
        size_bytes:
          type: integer
          minimum: 0
        checksum:
          type: string
          maxLength: 200
    ServiceRequest:
      allOf:
        - $ref: "#/components/schemas/ServiceRequestInput"
        - type: object
          required: [id, request_code, rider_id, status, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            request_code:
              type: string
              pattern: "^COR-(EMR|MOB|HOME|MNT|OTH)-[0-9]{8}-[0-9]+$"
            rider_id:
              type: string
              format: uuid
            status:
              $ref: "#/components/schemas/RequestStatus"
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
    PagedServiceRequests:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ServiceRequest"
        next_cursor:
          type: string
    ServiceType:
      enum:
        - emergency_rescue
        - mobile_repair
        - at_home_service
        - periodic_maintenance
        - other
    FulfillmentMode:
      enum:
        - immediate_location
        - scheduled_visit
    RequestStatus:
      enum:
        - submitted
        - dispatching
        - offered
        - assigned
        - mechanic_en_route
        - in_service
        - awaiting_quote_approval
        - awaiting_payment
        - completed
        - manual_escalation
        - canceled
    DispatchRound:
      type: object
      required: [id, request_id, round_number, status, expires_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        round_number:
          type: integer
        status:
          enum: [active, accepted, expired, canceled]
        expires_at:
          type: string
          format: date-time
    DispatchCandidate:
      type: object
      required: [id, request_id, mechanic_id, status, expires_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        mechanic_id:
          type: string
          format: uuid
        distance_m:
          type: integer
          minimum: 0
        status:
          description: >
            Closed MVP enum mirroring spec.md FR-010B. Any additional status
            requires a specification and migration amendment.
          enum: [pending, offered, accepted, rejected, expired, cancelled]
        expires_at:
          type: string
          format: date-time
    AssignmentStatus:
      enum:
        [accepted, en_route, on_site, diagnosis, quoted, awaiting_payment,
         in_progress, completed, canceled]
    Assignment:
      type: object
      required: [id, request_id, mechanic_id, status, accepted_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        mechanic_id:
          type: string
          format: uuid
        status:
          $ref: "#/components/schemas/AssignmentStatus"
        accepted_at:
          type: string
          format: date-time
    MechanicDiagnosisInput:
      type: object
      additionalProperties: false
      required: [diagnosis_text]
      properties:
        diagnosis_text:
          type: string
          minLength: 3
          maxLength: 5000
        recommended_work_text:
          type: string
          maxLength: 5000
        safety_notes:
          type: string
          maxLength: 2000
    MechanicDiagnosis:
      allOf:
        - $ref: "#/components/schemas/MechanicDiagnosisInput"
        - type: object
          required: [id, assignment_id, mechanic_id, created_at]
          properties:
            id:
              type: string
              format: uuid
            assignment_id:
              type: string
              format: uuid
            mechanic_id:
              type: string
              format: uuid
            created_at:
              type: string
              format: date-time
    QuoteLineInput:
      type: object
      additionalProperties: false
      required: [line_type, description, quantity, unit_amount]
      properties:
        line_type:
          enum: [labor, part, other]
        description:
          type: string
          minLength: 1
          maxLength: 500
        quantity:
          type: number
          exclusiveMinimum: 0
        unit_amount:
          type: integer
          minimum: 0
    QuoteInput:
      type: object
      additionalProperties: false
      required: [assignment_id, lines]
      properties:
        assignment_id:
          type: string
          format: uuid
        diagnosis_id:
          type: string
          format: uuid
        discount_amount:
          type: integer
          minimum: 0
        notes:
          type: string
          maxLength: 2000
        expires_at:
          type: string
          format: date-time
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/QuoteLineInput"
    Quote:
      type: object
      required:
        [id, request_id, assignment_id, version, status, currency, subtotal_amount, discount_amount, total_amount, lines, created_at]
      properties:
        id:
          type: string
          format: uuid
        request_id:
          type: string
          format: uuid
        assignment_id:
          type: string
          format: uuid
        version:
          type: integer
          minimum: 1
        status:
          enum: [pending, approved, rejected, superseded, expired]
        currency:
          const: VND
        subtotal_amount:
          type: integer
          minimum: 0
        discount_amount:
          type: integer
          minimum: 0
        total_amount:
          type: integer
          minimum: 0
        lines:
          type: array
          items:
            $ref: "#/components/schemas/QuoteLineInput"
        created_at:
          type: string
          format: date-time
    PaymentOrder:
      type: object
      required:
        [id, quote_id, status, provider_code, currency, expected_amount,
         created_at]
      properties:
        id:
          type: string
          format: uuid
        quote_id:
          type: string
          format: uuid
        status:
          enum: [created, pending, succeeded, failed, canceled, needs_review]
        provider_code:
          type: string
        currency:
          const: VND
        expected_amount:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
    ReminderRuleInput:
      type: object
      additionalProperties: false
      required: [motorcycle_id, title, next_due_at, enabled]
      properties:
        motorcycle_id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        interval_days:
          type: integer
          minimum: 1
          maximum: 3650
        next_due_at:
          type: string
          format: date-time
        enabled:
          type: boolean
    ReminderRule:
      allOf:
        - $ref: "#/components/schemas/ReminderRuleInput"
        - type: object
          required: [id, rider_id, created_at, updated_at]
          properties:
            id:
              type: string
              format: uuid
            rider_id:
              type: string
              format: uuid
            snoozed_until:
              type: string
              format: date-time
            created_at:
              type: string
              format: date-time
            updated_at:
              type: string
              format: date-time
