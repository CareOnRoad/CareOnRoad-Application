services:
  api:
    image: careonroad-api:local
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ${API_ENV_FILE:-./.env.local}
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    init: true
    restart: unless-stopped
